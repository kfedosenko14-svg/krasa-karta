<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>krasa.tt</title>
<meta name="theme-color" content="#fcd3e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="krasa.tt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@800&family=Sour+Gummy:wght@500;700&family=Balsamiq+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#6a8a2e; --ink:#4d6820; --cream:#fffad6; --pink:#fcd3e3; --pink-mid:#f9c6dc;
  --leaf:#a9cf6a; --bg:#fbf6ea; --muted:#8a8f6e; --line:#ebe3cf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 'Sour Gummy',system-ui,sans-serif;min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:420px;margin:0 auto}
.gl{font-family:Gluten,cursive;font-weight:800}
.hide{display:none!important}
.center{text-align:center}
.muted{color:var(--muted)}
.speck{background-image:
  radial-gradient(circle at 12% 18%,rgba(240,170,200,.8) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 37% 72%,rgba(240,170,200,.8) 0 1px,transparent 1.4px),
  radial-gradient(circle at 64% 30%,rgba(240,170,200,.8) 0 1.3px,transparent 1.7px),
  radial-gradient(circle at 83% 64%,rgba(240,170,200,.8) 0 1px,transparent 1.4px),
  radial-gradient(circle at 22% 88%,rgba(240,170,200,.8) 0 1.1px,transparent 1.5px),
  radial-gradient(circle at 91% 12%,rgba(240,170,200,.8) 0 1px,transparent 1.4px);
  background-size:90px 70px}

/* card */
.front{border-radius:18px;background:var(--pink);aspect-ratio:1.6;border:1.5px solid var(--green);position:relative;overflow:hidden}
.front .lbl{position:absolute;left:18px;top:14px;color:var(--green);font-size:13px;letter-spacing:1px}
.front .logo{position:absolute;left:0;right:0;top:50%;transform:translateY(-38%);text-align:center;font:700 clamp(44px,15vw,64px)/1 'Playfair Display',serif;color:var(--green)}
.front .est{position:absolute;left:18px;bottom:14px;color:var(--green);font-size:13px;opacity:.85}
.front .who{position:absolute;right:18px;bottom:12px;color:var(--green);font-size:20px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{margin-top:12px;border-radius:18px;background-color:var(--cream);padding:18px 14px 14px;border:1.5px solid var(--green)}
.back .title{text-align:center;font-size:21px;color:var(--green);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.slot{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center}
.slot svg{position:absolute;inset:0;width:100%;height:100%}
.slot .pc{position:relative;font:800 clamp(12px,3.6vw,15px) Gluten,cursive;color:var(--green)}
.slot.new svg.st{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
.rule{text-align:center;font-size:15px;color:var(--green);margin-top:12px}
.status{text-align:center;margin-top:14px;font-size:19px;color:var(--green)}
.reward{margin-top:10px;background:var(--pink);color:var(--green);border:1.5px solid var(--green);text-align:center;border-radius:14px;padding:12px;font-size:19px}
.qrbox{margin:16px auto 0;background:#fff;border-radius:16px;padding:14px;width:fit-content;text-align:center;border:2px solid var(--pink)}
.qrbox #qr img,.qrbox #qr canvas{display:block;margin:0 auto}
.qrt{font-size:14px;color:var(--muted);margin-top:6px}
.hint{margin-top:16px;background:#fff;border:1px dashed var(--green);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink)}

/* forms & panels */
.panel{background:#fff;border-radius:20px;padding:18px;border:1px solid var(--line);margin-top:12px}
.panel h2{font-size:24px;color:var(--green);margin-bottom:8px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:500 16px 'Sour Gummy',sans-serif;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--leaf);border-color:transparent}
.btn{display:inline-block;border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px 14px;font:700 15px 'Sour Gummy',sans-serif;cursor:pointer;white-space:nowrap}
.btn.big{display:block;width:100%;padding:18px;font-size:21px;border-radius:16px;margin-top:14px;white-space:normal;line-height:1.2}
.ru{font-family:-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:-.2px}
.btn.pink{background:var(--pink);color:var(--green);border:1.5px solid var(--green)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.err{color:#b4415e;font-size:14px;margin-top:8px;min-height:1em}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid #f1ebdc;gap:10px}
.row:last-child{border:0}
.nm{font-weight:700}.ig{font-size:13px;color:var(--muted)}
.igl{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.cnt{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:10px 0 4px}
.mini span{aspect-ratio:1;border-radius:50%;background:var(--pink)}
.mini span.f{background:var(--green)}
.res{text-align:center}
.res .emo{font-size:50px;line-height:1.1}
a.btn{text-decoration:none;text-align:center}
.res h3{font-size:30px;color:var(--green)}
.res.gold{background:var(--green);border-color:var(--green)}
.res.gold h3,.res.gold p{color:#fff}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.scanov{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.scanov video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanov .frame{position:absolute;left:50%;top:42%;width:66vmin;height:66vmin;transform:translate(-50%,-50%);border:4px solid var(--pink);border-radius:28px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanov .bar{padding:16px 16px max(20px,env(safe-area-inset-bottom));background:var(--bg);text-align:center}
.scanov .bar p{margin-bottom:10px;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
/* languages */
html[lang=uk] body{font-family:'Balsamiq Sans',system-ui,sans-serif;font-weight:400}
html[lang=uk] .gl{font-family:'Balsamiq Sans',system-ui,sans-serif;font-weight:700}
.lsw{display:flex;justify-content:flex-end;gap:4px;margin-bottom:10px}
.lsw button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:5px 10px;font:700 13px -apple-system,system-ui,sans-serif;cursor:pointer}
.lsw button.on{background:var(--green);border-color:var(--green);color:#fff}
.modal.lang{align-items:center}
.modal.lang .sheet{padding:26px 20px 18px}
.modal.lang .logo-s{font:700 40px/1 'Playfair Display',serif;color:var(--green);margin-bottom:10px}
.modal.lang h3{font-size:16px;color:var(--muted);font-weight:600;margin-bottom:8px}
.modal.lang .btn.big{margin-top:10px;font:700 20px -apple-system,system-ui,sans-serif}
/* swipe-to-delete rows */
#list{padding:6px 0;overflow:hidden}
.sw{position:relative;overflow:hidden;border-bottom:1px solid #f1ebdc}
.sw:last-child{border:0}
.sw .del{position:absolute;top:0;right:0;bottom:0;width:88px;background:#e0475f;color:#fff;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px -apple-system,system-ui,sans-serif;gap:2px;cursor:pointer}
.sw .del svg{width:26px;height:26px}
.sw .row{position:relative;background:#fff;border:0;padding:12px 18px;touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.sw .row.drag{transition:none}
.sw.gone{transition:height .25s ease,opacity .25s ease;opacity:0}
/* confirm sheet */
.modal{position:fixed;inset:0;background:rgba(30,40,20,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));animation:fade .15s}
.modal .sheet{background:#fff;border-radius:22px;width:100%;max-width:420px;padding:22px 18px 16px;text-align:center;animation:up .2s ease}
.modal .bin{width:54px;height:54px;border-radius:50%;background:#fde4e9;color:#e0475f;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.modal h3{font:700 19px -apple-system,system-ui,sans-serif;color:var(--ink);margin-bottom:6px}
.modal p{color:var(--muted);font-size:15px;margin-bottom:16px}
.modal .btn{display:block;width:100%;padding:15px;font-size:17px;border-radius:14px;margin-top:8px}
.modal .btn.red{background:#e0475f;color:#fff}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.top a{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="center muted" style="margin-top:40vh">…</p></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
<script>
const API = window.KRASA_API;
const STAMPS = 9;
const APP_VERSION = '7 · instagram';
const BASE = location.origin + location.pathname;
const $app = document.getElementById('app');
const params = new URLSearchParams(location.search);

/* ---------- storage (never required) ---------- */
const store = {
  get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} },
  del(k){ try{localStorage.removeItem(k)}catch(e){} },
};

/* ---------- helpers ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action, data={}){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});
  return r.json();
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function navWord(n){return n===1?'návšteva':(n>=2&&n<=4)?'návštevy':'návštev'}
function ruVisits(n){const a=n%10,b=n%100;return (a===1&&b!==11)?'визит':(a>=2&&a<=4&&(b<12||b>14))?'визита':'визитов'}
function scallop(fill){
  let d='';const n=12,R=48,r=43;
  for(let i=0;i<=n*2;i++){const a=Math.PI*i/n,rr=i%2?r:R;d+=(i?'L':'M')+(50+rr*Math.cos(a)).toFixed(1)+' '+(50+rr*Math.sin(a)).toFixed(1)}
  return `<svg viewBox="0 0 100 100"><path d="${d}Z" fill="${fill}" stroke="${fill}" stroke-width="5" stroke-linejoin="round"/></svg>`;
}
function star(i){
  let d='';for(let k=0;k<10;k++){const a=-Math.PI/2+Math.PI*k/5,rr=k%2?20:44;d+=(k?'L':'M')+(50+rr*Math.cos(a)).toFixed(1)+' '+(52+rr*Math.sin(a)).toFixed(1)}
  const rot=[-8,6,-4,10,-11,3,-6,9,-2][i%9];
  return `<svg class="st" viewBox="0 0 100 100" style="transform:rotate(${rot}deg)"><path d="${d}Z" fill="#6a8a2e" stroke="#6a8a2e" stroke-width="7" stroke-linejoin="round"/></svg>`;
}
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

/* ================= CLIENT: languages ================= */
const LANGS={sk:'🇸🇰 Slovensky',uk:'🇺🇦 Українська',en:'🇬🇧 English'};
const T={
 sk:{label:'vernostná karta',yourCard:'Vaša karta 💗',rule:'Každá návšteva = 1 hviezdička. 10. návšteva so zľavou 50 %.',
  name:'Meno',igPh:'@vas.instagram',create:'Vytvoriť kartu',wait:'Chvíľku…',needName:'Napíšte, prosím, svoje meno.',
  tooMany:'Skúste to, prosím, o chvíľu.',fail:'Nepodarilo sa. Skúste to znova.',thanks:'Ďakujem, že ste so mnou',
  left:n=>`Ešte ${n} ${n===1?'návšteva':(n>=2&&n<=4)?'návštevy':'návštev'} a potom −50 %`,
  next:'Ďalšia návšteva je so zľavou −50 % 🥰',reward:'🎉 Táto návšteva je so zľavou −50 %',show:'Ukážte tento kód pri návšteve',
  saveT:'Uložte si kartu na plochu:',
  ios:'ťuknite dole na <b>Zdieľať</b> (štvorček so šípkou) → <b>Pridať na plochu</b>.',
  android:'ťuknite na <b>⋮</b> vpravo hore → <b>Pridať na plochu</b> alebo <b>Inštalovať</b>.',
  star:'Pribudla hviezdička ⭐',used:'Zľava uplatnená 🎉 Karta začína odznova',
  nf:'Karta sa nenašla',nfT:'Napíšte, prosím, do Instagramu @krasa.tt 💗',offline:'Bez internetu 🙈',title:'krasa.tt · vernostná karta'},
 uk:{label:'картка лояльності',yourCard:'Ваша картка 💗',rule:'Кожен візит = 1 зірочка. 10-й візит зі знижкою 50 %.',
  name:'Ім’я',igPh:'@vash.instagram',create:'Створити картку',wait:'Хвилинку…',needName:'Напишіть, будь ласка, своє ім’я.',
  tooMany:'Спробуйте, будь ласка, трохи пізніше.',fail:'Не вдалося. Спробуйте ще раз.',thanks:'Дякую, що ви зі мною',
  left:n=>`Ще ${n} ${n===1?'візит':(n>=2&&n<=4)?'візити':'візитів'}, а потім −50 %`,
  next:'Наступний візит зі знижкою −50 % 🥰',reward:'🎉 Цей візит зі знижкою −50 %',show:'Покажіть цей код під час візиту',
  saveT:'Збережіть картку на екран:',
  ios:'натисніть унизу <b>Поділитися</b> (квадратик зі стрілкою) → <b>На початковий екран</b> (Add to Home Screen).',
  android:'натисніть <b>⋮</b> угорі праворуч → <b>Додати на головний екран</b> або <b>Встановити</b>.',
  star:'Додалася зірочка ⭐',used:'Знижку використано 🎉 Картка починається спочатку',
  nf:'Картку не знайдено',nfT:'Напишіть, будь ласка, в Instagram @krasa.tt 💗',offline:'Немає інтернету 🙈',title:'krasa.tt · картка лояльності'},
 en:{label:'loyalty card',yourCard:'Your card 💗',rule:'Every visit = 1 star. Your 10th visit is 50 % off.',
  name:'Name',igPh:'@your.instagram',create:'Create my card',wait:'One moment…',needName:'Please enter your name.',
  tooMany:'Please try again in a moment.',fail:'Something went wrong. Please try again.',thanks:'Thank you for being with me',
  left:n=>`${n} more ${n===1?'visit':'visits'}, then −50 %`,
  next:'Your next visit is −50 % 🥰',reward:'🎉 This visit is −50 %',show:'Show this code at your visit',
  saveT:'Save the card to your home screen:',
  ios:'tap <b>Share</b> at the bottom (square with an arrow) → <b>Add to Home Screen</b>.',
  android:'tap <b>⋮</b> at the top right → <b>Add to Home screen</b> or <b>Install</b>.',
  star:'New star added ⭐',used:'Discount used 🎉 Your card starts again',
  nf:'Card not found',nfT:'Please message @krasa.tt on Instagram 💗',offline:'No internet 🙈',title:'krasa.tt · loyalty card'},
};
function getLang(){ const l=store.get('krasa_lang')||params.get('l'); return T[l]?l:null }
let LANG=getLang()||'sk';
function t(k,...a){ const v=T[LANG][k]; return typeof v==='function'?v(...a):v }
function setLang(l){
  LANG=l; store.set('krasa_lang',l); document.documentElement.lang=l;
  const u=new URL(location.href); u.searchParams.set('l',l); history.replaceState(null,'',u);
}
document.documentElement.lang=LANG;
function langSwitch(){
  return `<div class="lsw">${Object.keys(LANGS).map(l=>`<button class="${l===LANG?'on':''}" onclick="switchLang('${l}')">${l==='uk'?'UA':l.toUpperCase()}</button>`).join('')}</div>`;
}
function switchLang(l){ setLang(l); route(); }
function chooseLang(){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='modal lang';
    m.innerHTML=`<div class="sheet"><div class="logo-s">krasa.tt</div>
      <h3>Vyberte jazyk · Оберіть мову · Choose language</h3>
      ${Object.entries(LANGS).map(([l,n])=>`<button class="btn big pink" data-l="${l}">${n}</button>`).join('')}</div>`;
    document.body.appendChild(m);
    m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ setLang(b.dataset.l); m.remove(); res(); });
  });
}
function front(name){
  return `<div class="front"><div class="lbl gl">${t('label')}</div><div class="logo">krasa.tt</div><div class="est">nail studio · Trnava</div>${name!==undefined?'<div class="who gl" id="who"></div>':''}</div>`;
}

/* ================= CLIENT: registration ================= */
async function viewRegister(){
  if(!getLang()) await chooseLang();
  document.title=t('title');
  $app.innerHTML = `${langSwitch()}
    ${front()}
    <div class="panel">
      <h2 class="gl">${t('yourCard')}</h2>
      <p class="muted">${t('rule')}</p>
      <form id="f">
        <label for="n">${t('name')}</label><input id="n" autocomplete="given-name" maxlength="40" required>
        <label for="i">Instagram</label><input id="i" placeholder="${t('igPh')}" autocapitalize="off" autocorrect="off" maxlength="40">
        <button class="btn big" id="b">${t('create')}</button>
        <div class="err" id="e"></div>
      </form>
    </div>`;
  document.getElementById('f').onsubmit = async ev=>{
    ev.preventDefault();
    const b=document.getElementById('b'), e=document.getElementById('e');
    const name=document.getElementById('n').value.trim(), ig=document.getElementById('i').value.trim();
    if(!name){e.textContent=t('needName');return}
    b.disabled=true;b.textContent=t('wait');e.textContent='';
    try{
      const r=await api('register',{name,ig,lang:LANG});
      if(!r.ok) throw new Error(r.err);
      store.set('krasa_id',r.id);
      location.replace(BASE+'?k='+encodeURIComponent(r.id)+'&l='+LANG);
    }catch(err){
      e.textContent = err.message==='too_many' ? t('tooMany') : t('fail');
      b.disabled=false;b.textContent=t('create');
    }
  };
}

/* ================= CLIENT: card ================= */
let shown=-1, pollT=null, pollUntil=0;
async function viewCard(id){
  store.set('krasa_id',id);
  if(!params.get('l')) setLang(LANG);
  document.title=t('title');
  shown=-1;
  $app.innerHTML = `${langSwitch()}
    ${front('')}
    <div class="back speck">
      <div class="title gl">${t('thanks')}</div>
      <div class="grid" id="stamps"></div>
      <div class="rule">${t('rule')}</div>
    </div>
    <div class="status gl" id="status"></div>
    <div class="reward gl hide" id="reward">${t('reward')}</div>
    <div class="qrbox"><div id="qr"></div><div class="qrt">${t('show')}</div></div>
    <div class="hint ${isStandalone?'hide':''}" id="hint">
      📲 <b>${t('saveT')}</b><br>${isIOS ? t('ios') : t('android')}
    </div>`;
  if(window.QRCode) new QRCode(document.getElementById('qr'),{text:BASE+'?a='+id,width:132,height:132,colorDark:'#4d6820',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  await refreshCard(id,true);
  startPoll(id);
}
async function refreshCard(id,first){
  let r;
  try{ r=await api('card',{id}); }catch(e){ if(first) document.getElementById('status').textContent=t('offline'); return }
  if(!r.ok){
    if(r.err==='not_found'){ store.del('krasa_id'); $app.innerHTML=`<div class="panel center"><h2 class="gl">${t('nf')}</h2><p class="muted">${t('nfT')}</p></div>`; stopPoll(); }
    return;
  }
  const who=document.getElementById('who'); if(!who) return;
  who.textContent=r.name;
  const v=r.visits;
  if(v!==shown){
    let h='';
    for(let i=1;i<=10;i++){
      if(i===10) h+=`<div class="slot">${scallop(v>=STAMPS?'#a9cf6a':'#f9c6dc')}<span class="pc">−50%</span></div>`;
      else h+=`<div class="slot${(!first&&i===v&&v>shown)?' new':''}">${scallop('#f9c6dc')}${i<=v?star(i):''}</div>`;
    }
    document.getElementById('stamps').innerHTML=h;
    if(!first && v>shown) toast(t('star'));
    if(!first && v===0 && shown>=STAMPS) toast(t('used'));
    shown=v;
  }
  document.getElementById('status').textContent = v>=STAMPS ? t('next') : t('left',STAMPS-v);
  document.getElementById('reward').classList.toggle('hide',v<STAMPS);
}
function startPoll(id){
  pollUntil=Date.now()+10*60*1000;
  stopPoll();
  pollT=setInterval(()=>{ if(document.visibilityState!=='visible')return; if(Date.now()>pollUntil){stopPoll();return} refreshCard(id,false); },5000);
}
function stopPoll(){ if(pollT){clearInterval(pollT);pollT=null} }
document.addEventListener('visibilitychange',()=>{
  const id=params.get('k'); if(id&&document.visibilityState==='visible'){ refreshCard(id,false); if(!pollT) startPoll(id); }
});

/* ================= ADMIN ================= */

async function adminApi(action,data){
  const r=await api(action,{...data,token:token()});
  if(!r.ok && r.err==='auth'){ store.del('krasa_admin'); route(); throw new Error('auth'); }
  return r;
}
function viewLogin(next){
  document.title='krasa.tt · вход';
  $app.innerHTML=`
    <div class="panel">
      <h2 class="ru">Вход для мастера</h2>
      <p class="muted">Если ты клиентка — эта страница не для вас 💗<br><span style="font-size:13px">Táto stránka je len pre majsterku.</span></p>
      <form id="f"><label for="p">PIN</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password">
      <button class="btn big">Войти</button><div class="err" id="e"></div></form>
    </div>`;
  document.getElementById('f').onsubmit=async ev=>{
    ev.preventDefault();

      else e.textContent = r.err==='locked' ? 'Слишком много попыток. Подожди 15 минут.' : r.err==='pin_not_set' ? 'PIN ещё не задан в Google (ADMIN_PIN).' : 'Неверный PIN';
    }catch(err){ e.textContent='Нет связи. Попробуй ещё раз.' }

function igLink(ig){
  const u=String(ig||'').replace(/^@/,'');
  if(!/^[A-Za-z0-9._]{1,30}$/.test(u)) return esc(ig);
  return `<a class="igl" href="https://instagram.com/${u}" target="_blank" rel="noopener">@${esc(u)}</a>`;
}
function mini(v){let h='';for(let i=1;i<=STAMPS;i++)h+=`<span class="${i<=v?'f':''}"></span>`;return `<div class="mini">${h}</div>`}
function cardLink(id){return BASE+'?k='+encodeURIComponent(id)}
async function copyLink(id){
  const url=cardLink(id);
  try{ await navigator.clipboard.writeText(url); toast('Ссылка скопирована, отправь её в Instagram'); }
  catch(e){ prompt('Скопируй ссылку:',url); }
}

/* after scanning a client's QR */
async function viewClient(id){
  document.title='krasa.tt · клиентка';
  $app.innerHTML='<div class="panel res"><p class="muted">Загружаю…</p></div>';
  let r; try{ r=await adminApi('client',{id}); }catch(e){ return }
  if(!r.ok){ $app.innerHTML='<div class="panel res"><h3 class="ru">Не найдено</h3><p class="muted">Такой карточки нет.</p></div>'+navLinks(); return }
  drawClient(r.client);
}
function drawClient(c, msg){
  const done=c.visits>=STAMPS;
  let body;
  if(msg) body=msg;
  else if(c.today) body=`<p class="muted">Сегодня визит уже засчитан ✓</p>${mini(c.visits)}
      <button class="btn big ghost" id="force">Всё равно добавить ещё один</button>`;
  else if(done) body=`<p class="muted">${igLink(c.ig)} · уже ${STAMPS} ${ruVisits(STAMPS)}</p>${mini(c.visits)}
      <p style="font-weight:700;margin-top:8px">Сегодня 10-й визит: скидка −50 % 🎉</p>
      <button class="btn big" id="add">Скидка −50 % использована ✓</button>`;
  else body=`<p class="muted">${igLink(c.ig)} · ${c.visits} из ${STAMPS}</p>${mini(c.visits)}
      <button class="btn big" id="add">+1 визит</button>`;
  $app.innerHTML=`<div class="panel res" id="res"><h3 class="gl">${esc(c.name)}</h3>${body}</div>${navLinks(c.id)}`;
  const add=document.getElementById('add'), force=document.getElementById('force'), und=document.getElementById('undo');
  if(add) add.onclick=()=>doVisit(c.id,false,add);
  if(force) force.onclick=()=>doVisit(c.id,true,force);
  if(und) und.onclick=()=>doUndo(c.id,und);
}
async function doVisit(id,force,btn){
  btn.disabled=true;
  let r; try{ r=await adminApi('visit',{id,force}); }catch(e){ btn.disabled=false; toast('Нет связи, попробуй ещё раз'); return }
  if(!r.ok){ if(r.client) drawClient(r.client); else toast('Ошибка: '+r.err); return }
  const c=r.client;
  const msg = r.discount
    ? `<div class="emo">🎉</div><p>Скидка −50 % отмечена.<br>Карточка начинается заново.</p><button class="btn ghost" id="undo" style="margin-top:12px">Отменить</button>`
    : `<div class="emo">✓</div><p class="muted">Визит добавлен: ${c.visits} из ${STAMPS}${c.visits===STAMPS?'<br><b>В следующий раз −50 % 🥰</b>':''}</p>${mini(c.visits)}<button class="btn ghost" id="undo" style="margin-top:12px">Отменить</button>`;
  drawClient(c,msg);
  if(r.discount) document.getElementById('res').classList.add('gold');
}
async function doUndo(id,btn){
  btn.disabled=true;
  let r; try{ r=await adminApi('undo',{id}); }catch(e){ btn.disabled=false; return }
  if(!r.ok){ toast('Нечего отменять'); return }
  drawClient(r.client,`<div class="emo">↩️</div><p class="muted">Отменено. Сейчас ${r.client.visits} из ${STAMPS}</p>${mini(r.client.visits)}`);
}
function navLinks(id){
  return `<button class="btn big" onclick="startScan()">📷 Сканировать следующую</button>
    <div class="links">
    ${id?`<button class="btn ghost" onclick="copyLink('${esc(id)}')">Ссылка на её карточку</button>`:''}
    <a class="btn ghost" href="${BASE}?admin">Все клиентки</a></div>
    ${id?`<p class="center" style="margin-top:22px"><button class="btn ghost" style="color:#b4415e;border-color:#f0c9d4" onclick="removeFromPage('${esc(id)}')">Удалить клиентку</button></p>`:''}`;
}
const BIN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
function askDelete(name){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="sheet"><div class="bin">${BIN_SVG}</div>
      <h3>Удалить ${esc(name)}?</h3><p>Её карточка перестанет работать. Это нельзя отменить.</p>
      <button class="btn red" id="mY">Удалить</button><button class="btn ghost" id="mN">Отмена</button></div>`;
    document.body.appendChild(m);
    const done=v=>{m.remove();res(v)};
    m.querySelector('#mY').onclick=()=>done(true);
    m.querySelector('#mN').onclick=()=>done(false);
    m.onclick=e=>{if(e.target===m)done(false)};
  });
}
async function removeClient(id,name){
  const c=allClients.find(x=>x.id===id);
  if(!await askDelete(name||(c&&c.name)||'клиентку')) return false;
  let r; try{ r=await adminApi('remove',{id}); }catch(e){ toast('Нет связи'); return false }
  if(!r.ok){ toast('Ошибка: '+r.err); return false }
  toast('Удалено');
  return true;
}
async function removeFromPage(id,name){
  if(await removeClient(id,name)) setTimeout(()=>location.href=BASE+'?admin',700);
}

/* in-app QR scanner (camera inside the master's icon) */
let scanStream=null, scanRAF=null;
async function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Камера здесь недоступна'); return }
  if(!window.jsQR){ toast('Сканер ещё грузится, попробуй через секунду'); return }
  const ov=document.createElement('div'); ov.className='scanov'; ov.id='scanov';
  ov.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div>
    <div class="bar"><p>Наведи камеру на QR с карточки клиентки</p><button class="btn ghost" id="scx">Закрыть</button></div>`;
  document.body.appendChild(ov);
  document.getElementById('scx').onclick=stopScan;
  const video=ov.querySelector('video');
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  }catch(e){ stopScan(); toast('Нет доступа к камере. Разреши камеру в настройках.'); return }
  video.srcObject=scanStream; await video.play().catch(()=>{});
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!scanStream) return;
    if(video.readyState>=2 && video.videoWidth){
      const w=Math.min(720,video.videoWidth), h=Math.round(video.videoHeight*w/video.videoWidth);
      cv.width=w; cv.height=h; cx.drawImage(video,0,0,w,h);
      const code=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
      if(code&&code.data){
        const id=idFromQR(code.data);
        if(id){ if(navigator.vibrate) navigator.vibrate(60); stopScan(); location.href=BASE+'?a='+encodeURIComponent(id); return }
        ov.querySelector('.bar p').textContent = code.data.split('?')[0]===BASE
          ? 'Это QR для регистрации: его клиентки сканируют своей камерой. Наведи на QR с карточки клиентки 💗'
          : 'Это не карточка krasa.tt 🙈';
      }
    }
    scanRAF=requestAnimationFrame(tick);
  };
  tick();
}
function idFromQR(text){
  try{ const u=new URL(text); const id=u.searchParams.get('a')||u.searchParams.get('k'); return id&&/^[A-Za-z0-9]{12,32}$/.test(id)?id:null }
  catch(e){ return null }
}
function stopScan(){
  if(scanRAF) cancelAnimationFrame(scanRAF); scanRAF=null;
  if(scanStream) scanStream.getTracks().forEach(t=>t.stop()); scanStream=null;
  const ov=document.getElementById('scanov'); if(ov) ov.remove();
}

/* swipe a row right-to-left to reveal the red bin (like Instagram chats) */
const OPEN_X=-88;
let openRow=null;
function closeRow(row){ if(row){ row.style.transform=''; row._open=false; } if(openRow===row) openRow=null; }
function setupSwipe(sw){
  const row=sw.querySelector('.row'), del=sw.querySelector('.del');
  let x0=0,y0=0,dx=0,drag=false,decided=false,horiz=false,moved=false;
  row.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    x0=e.clientX;y0=e.clientY;dx=0;drag=true;decided=false;horiz=false;moved=false;
  });
  row.addEventListener('pointermove',e=>{
    if(!drag) return;
    const mx=e.clientX-x0, my=e.clientY-y0;
    if(!decided){ if(Math.abs(mx)<8&&Math.abs(my)<8) return; decided=true; horiz=Math.abs(mx)>Math.abs(my);
      if(horiz){ row.setPointerCapture(e.pointerId); row.classList.add('drag'); if(openRow&&openRow!==row) closeRow(openRow); } }
    if(!horiz) return;
    moved=true;
    const base=row._open?OPEN_X:0;
    dx=Math.max(OPEN_X-30,Math.min(0,base+mx));
    row.style.transform=`translateX(${dx}px)`;
  });
  const end=()=>{
    if(!drag) return; drag=false; row.classList.remove('drag');
    if(!horiz) return;
    if(dx<OPEN_X/2){ row.style.transform=`translateX(${OPEN_X}px)`; row._open=true; openRow=row; }
    else closeRow(row);
  };
  row.addEventListener('pointerup',end); row.addEventListener('pointercancel',end);
  // a swipe must not count as a tap on "открыть"; a tap on an open row closes it
  row.addEventListener('click',e=>{ if(moved||row._open){ e.preventDefault(); e.stopPropagation(); if(!moved) closeRow(row); moved=false; } },true);
  del.onclick=async()=>{
    const id=sw.dataset.id, c=allClients.find(x=>x.id===id);
    if(await removeClient(id,c&&c.name)){
      sw.style.height=sw.offsetHeight+'px'; sw.offsetHeight; sw.classList.add('gone'); sw.style.height='0px';
      allClients=allClients.filter(x=>x.id!==id);
      setTimeout(()=>drawList(document.getElementById('q').value),280);
    } else closeRow(row);
  };
}

/* ================= router ================= */
function route(){
  if(!API || API.startsWith('PASTE_')){ $app.innerHTML='<div class="panel">Нет адреса Google Apps Script в config.js</div>'; return }
  const k=params.get('k'), a=params.get('a');
  if(a){ token()?viewClient(a):viewLogin(()=>viewClient(a)); return }
  if(params.has('admin')){ token()?viewList():viewLogin(viewList); return }
  if(k){ viewCard(k); return }
  const saved=store.get('krasa_id');
  if(saved){ location.replace(BASE+'?k='+encodeURIComponent(saved)); return }
  viewRegister();
}
route();
